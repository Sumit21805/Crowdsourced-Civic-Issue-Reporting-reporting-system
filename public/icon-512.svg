<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Shield -->
  <path d="M256 80 L380 130 L380 270 C380 340 320 390 256 420 C192 390 132 340 132 270 L132 130 Z"
        fill="url(#shield)" filter="url(#glow)" opacity="0.9"/>
  <!-- Map Pin -->
  <circle cx="256" cy="230" r="45" fill="#0f172a"/>
  <path d="M256 170 C220 170 190 200 190 236 C190 272 256 330 256 330 C256 330 322 272 322 236 C322 200 292 170 256 170 Z"
        fill="white" opacity="0.95"/>
  <circle cx="256" cy="236" r="22" fill="#3b82f6"/>
</svg>
