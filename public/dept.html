<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicGuard — Department Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at top, #1e293b, #0f172a);
        }

        .login-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 48px;
            width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .login-box h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 32px;
        }

        .dept-btn {
            width: 100%;
            padding: 16px 20px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            color: #e2e8f0;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            text-align: left;
            overflow: hidden;
        }

        .dept-btn:hover {
            border-color: #60a5fa;
            background: #1e3a5f;
            transform: translateY(-1px);
        }

        .dept-btn .icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .dept-btn .dept-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }

        .dept-btn .dept-info .name {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dept-btn .handles {
            font-size: 9px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Dashboard */
        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .top-bar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-bar h1 {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-bar .dept-name {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-bar .dept-name .icon {
            font-size: 18px;
        }

        .logout-btn {
            background: #334155;
            border: none;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #475569;
            color: #fff;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            padding: 24px 32px;
        }

        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .stat-card .label {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .stat-card.pending .number {
            color: #f59e0b;
        }

        .stat-card.resolved .number {
            color: #34d399;
        }

        .stat-card.total .number {
            color: #60a5fa;
        }

        /* Reports Grid */
        .reports-section {
            padding: 0 32px 32px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 800;
            color: #64748b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .auto-refresh-badge {
            font-size: 9px;
            background: #34d399;
            color: #0f172a;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }

        .report-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.2s;
        }

        .report-card:hover {
            border-color: #60a5fa;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .report-card.resolved-card {
            opacity: 0.6;
        }

        .report-card.resolved-card:hover {
            opacity: 1;
        }

        .report-card .image-area {
            width: 100%;
            height: 160px;
            background: #0f172a;
            position: relative;
            overflow: hidden;
        }

        .report-card .image-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .report-card .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge.assigned {
            background: #f59e0b;
            color: #0f172a;
        }

        .badge.resolved {
            background: #34d399;
            color: #0f172a;
        }

        .report-card .id-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #94a3b8;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            font-family: monospace;
        }

        .report-card .info {
            padding: 16px;
        }

        .report-card .info .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .report-card .type-tag {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
        }

        .report-card .confidence {
            font-size: 11px;
            color: #22d3ee;
            font-weight: 700;
            font-family: monospace;
        }

        .report-card .meta {
            font-size: 10px;
            color: #64748b;
            font-weight: 600;
        }

        .report-card .coords {
            font-size: 10px;
            color: #475569;
            font-family: monospace;
            margin-top: 4px;
        }

        .report-card .reporter {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
        }

        .reporter .avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #fff;
            font-weight: 900;
        }

        .resolve-area {
            padding: 0 16px 16px;
        }

        .resolve-textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px;
            color: #e2e8f0;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            resize: none;
            margin-bottom: 8px;
        }

        .resolve-textarea:focus {
            outline: none;
            border-color: #34d399;
        }

        .resolve-btn {
            width: 100%;
            padding: 12px;
            background: #059669;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .resolve-btn:hover {
            background: #10b981;
            transform: translateY(-1px);
        }

        .resolve-btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        .resolution-note {
            background: #064e3b;
            border: 1px solid #065f46;
            border-radius: 10px;
            padding: 10px;
            font-size: 11px;
            color: #6ee7b7;
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #334155;
        }

        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 14px;
            color: #64748b;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .login-box {
            animation: fadeInUp 0.5s ease-out;
        }

        .dept-btn {
            animation: fadeInUp 0.4s ease-out both;
        }

        .dept-btn:nth-child(1) {
            animation-delay: 0.05s;
        }

        .dept-btn:nth-child(2) {
            animation-delay: 0.1s;
        }

        .dept-btn:nth-child(3) {
            animation-delay: 0.15s;
        }

        .report-card {
            animation: fadeInUp 0.4s ease-out both;
        }

        .stat-card {
            animation: fadeInUp 0.3s ease-out both;
        }

        .stat-card:nth-child(1) {
            animation-delay: 0s;
        }

        .stat-card:nth-child(2) {
            animation-delay: 0.05s;
        }

        .stat-card:nth-child(3) {
            animation-delay: 0.1s;
        }

        /* Smooth Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>

<body>

    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>CivicGuard</h1>
            <div class="subtitle">Department Portal</div>
            <div id="deptButtons"></div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="top-bar">
            <div>
                <h1>CivicGuard</h1>
            </div>
            <div class="dept-name">
                <span class="icon" id="deptIcon"></span>
                <span id="deptLabel"></span>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="stats-bar">
            <div class="stat-card pending">
                <div class="number" id="pendingCount">0</div>
                <div class="label">Pending Action</div>
            </div>
            <div class="stat-card resolved">
                <div class="number" id="resolvedCount">0</div>
                <div class="label">Completed</div>
            </div>
            <div class="stat-card total">
                <div class="number" id="totalCount">0</div>
                <div class="label">Total Managed</div>
            </div>
        </div>

        <div class="reports-section">
            <div class="section-title">
                <span>Assigned Reports</span>
                <div class="auto-refresh-badge">
                    <span>●</span> LIVE — Auto-Refresh 10s
                </div>
            </div>
            <div class="reports-grid" id="reportsGrid"></div>
        </div>
    </div>

    <script>
        const API = `http://${window.location.hostname}:5000`;
        let currentDept = null;
        let departments = [];
        let refreshInterval = null;

        // Load departments on page load
        async function init() {
            try {
                const res = await fetch(`${API}/api/departments`);
                departments = await res.json();
                renderDeptButtons();
            } catch (e) {
                console.error('Failed to load departments:', e);
            }
        }

        function renderDeptButtons() {
            const container = document.getElementById('deptButtons');
            container.innerHTML = departments.map(d => `
                <button class="dept-btn" onclick="login('${d.id}')">
                    <span class="icon">${d.icon}</span>
                    <div class="dept-info">
                        <span class="name">${d.name}</span>
                        <span class="handles">${d.handles}</span>
                    </div>
                </button>
            `).join('');
        }

        function login(deptId) {
            currentDept = departments.find(d => d.id === deptId);
            if (!currentDept) return;

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('deptIcon').textContent = currentDept.icon;
            document.getElementById('deptLabel').textContent = currentDept.name;

            loadReports();
            // Auto-refresh every 10 seconds
            refreshInterval = setInterval(loadReports, 10000);
        }

        function logout() {
            currentDept = null;
            clearInterval(refreshInterval);
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboard').classList.remove('active');
        }

        function animateValue(id, start, end, duration) {
            if (start === end) return;
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        async function loadReports() {
            if (!currentDept) return;
            try {
                const [reportsRes, statsRes] = await Promise.all([
                    fetch(`${API}/api/departments/${currentDept.id}/reports`),
                    fetch(`${API}/api/departments/${currentDept.id}/stats`)
                ]);
                const reports = await reportsRes.json();
                const stats = await statsRes.json();

                const oldPending = parseInt(document.getElementById('pendingCount').textContent) || 0;
                animateValue('pendingCount', oldPending, stats.pending || 0, 800);

                const oldResolved = parseInt(document.getElementById('resolvedCount').textContent) || 0;
                animateValue('resolvedCount', oldResolved, stats.resolved || 0, 800);

                const oldTotal = parseInt(document.getElementById('totalCount').textContent) || 0;
                animateValue('totalCount', oldTotal, stats.total || 0, 800);

                renderReports(reports);
            } catch (e) {
                console.error('Failed to load reports:', e);
            }
        }

        function renderReports(reports) {
            const grid = document.getElementById('reportsGrid');
            if (reports.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="emoji">📭</div>
                        <h3>No reports assigned yet</h3>
                    </div>`;
                return;
            }

            grid.innerHTML = reports.map(r => `
                <div class="report-card ${r.status === 'Resolved' ? 'resolved-card' : ''}">
                    <div class="image-area">
                        ${r.image_path ? `<img src="${API}${r.image_path}" alt="${r.type}">` : ''}
                        <span class="id-badge">#${r.id}</span>
                        <span class="badge ${r.status.toLowerCase()}">${r.status}</span>
                    </div>
                    <div class="info">
                        <div class="row">
                            <span class="type-tag">${r.type}</span>
                            <span class="confidence">AI: ${(r.confidence * 100).toFixed(1)}%</span>
                        </div>
                        <div class="coords">${r.lat ? r.lat.toFixed(6) + ', ' + r.lng.toFixed(6) : 'No location'}</div>
                        <div class="reporter">
                            <span class="avatar">${(r.user_name || '?')[0].toUpperCase()}</span>
                            <span>${r.user_name}</span>
                            <span class="meta" style="margin-left:auto">${r.reported_at || ''}</span>
                        </div>
                        ${r.status === 'Resolved' && r.resolution_note ? `<div class="resolution-note">✅ ${r.resolution_note}</div>` : ''}
                    </div>
                    ${r.status === 'Assigned' ? `
                        <div class="resolve-area">
                            <textarea class="resolve-textarea" id="note-${r.id}" rows="2" placeholder="Resolution note (e.g., Pothole filled, area cleaned)..."></textarea>
                            <button class="resolve-btn" id="btn-${r.id}" onclick="resolveReport(${r.id})">
                                ✅ Mark as Resolved
                            </button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        async function resolveReport(id) {
            const note = document.getElementById(`note-${id}`)?.value || '';
            const btn = document.getElementById(`btn-${id}`);
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Resolving...';
            }

            try {
                const res = await fetch(`${API}/api/incidents/${id}/resolve`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resolution_note: note })
                });
                if (res.ok) {
                    loadReports(); // Refresh immediately
                }
            } catch (e) {
                console.error('Failed to resolve:', e);
                btn.disabled = false;
                btn.textContent = '✅ Mark as Resolved';
            }
        }

        init();
    </script>
</body>

</html>
